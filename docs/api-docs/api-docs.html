<!DOCTYPE html>
<html>
<head>
    <title>ReDoc</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        :root {
            --font-family-base: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
            --heading-font-family: 'Plus Jakarta Sans', Inter, sans-serif;
            --font-size-base: 16px;
        }

        :root:has(.redoc.light) {
            --color-primary-base: #4f46e5;
            --sidebar-bg-color: #fbfbfd;
        }

        :root:has(.redoc.dark) {
            --color-primary-base: #7c7ff2;
        }
    </style>
</head>
<body>
<div id="redoc-container"></div>
<script type="module">
    import { init } from 'https://unpkg.com/redoc@3.1.0/bundles/redoc.standalone.js';

    init(
        "./api-docs.yml",
        {
            "sanitize": true
        },
        document.getElementById('redoc-container'));
</script>
</body>
</html>
