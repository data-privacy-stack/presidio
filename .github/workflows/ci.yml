name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  REGISTRY_NAME: ghcr.io/data-privacy-stack
  TAG: gha${{ github.run_number }}

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install --no-deps --require-hashes -r .github/pipelines/requirements-ruff.txt

      - name: Run ruff check
        run: ruff check

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-slim
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.5.0
        with:
          fail-on-severity: low
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, 0BSD, 0BSD AND Apache-2.0 AND BSD-3-Clause AND MIT
          comment-summary-in-pr: on-failure

  test:
    name: Test ${{ matrix.component.name }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        component: 
          - name: 'Analyzer'
            path: 'presidio-analyzer'
            extras: '--all-extras'
            spacy-models: 'en_core_web_lg en_core_web_sm'
          - name: 'Anonymizer'
            path: 'presidio-anonymizer'
            extras: ''
            spacy-models: ''
          - name: 'Image Redactor'
            path: 'presidio-image-redactor'
            extras: ''
            spacy-models: 'en_core_web_lg'
          - name: 'CLI'
            path: 'presidio-cli'
            extras: ''
            spacy-models: ''
          - name: 'Structured'
            path: 'presidio-structured'
            extras: ''
            spacy-models: ''
        include:
          - python-version: '3.14'
            component:
              name: 'Analyzer'
              path: 'presidio-analyzer'
              extras: '--all-extras'
              spacy-models: 'en_core_web_lg en_core_web_sm'
    env:
      COVERAGE_THRESHOLD: 90
      PRIMARY_PYTHON: '3.13'
      # Keep uv's (potentially large) wheel cache on the runner's roomy
      # ephemeral disk (/mnt, ~65 GB) rather than the smaller root volume, as
      # the previous Poetry setup did via POETRY_CACHE_DIR. The cache is
      # persisted across runs by the "Cache uv downloads" step below, keyed on
      # the committed uv.lock. UV_LINK_MODE=copy avoids the cross-filesystem
      # hardlink warning since the project venv lives on the root volume.
      UV_CACHE_DIR: /mnt/uv-cache
      UV_LINK_MODE: copy
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ matrix.component.path }}/pyproject.toml

      - name: Install uv
        run: python -m pip install uv==0.11.6

      - name: Prepare uv cache directory on /mnt
        run: |
          # /mnt is root-owned, so create the cache dir and hand it to the
          # runner user before uv (or the cache restore) writes to it.
          sudo mkdir -p "$UV_CACHE_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$UV_CACHE_DIR"

      - name: Cache uv downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: /mnt/uv-cache
          key: uv-${{ runner.os }}-${{ matrix.component.path }}-py${{ matrix.python-version }}-${{ hashFiles(format('{0}/uv.lock', matrix.component.path)) }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.component.path }}-py${{ matrix.python-version }}-
            uv-${{ runner.os }}-${{ matrix.component.path }}-

      - name: Install system dependencies for Image Redactor
        if: matrix.component.name == 'Image Redactor'
        run: |
          sudo apt-get update
          sudo apt-get install tesseract-ocr -y

      - name: Install dependencies
        timeout-minutes: 30
        working-directory: ${{ matrix.component.path }}
        run: |
          # Install from the committed uv.lock with `uv sync --locked`: uv
          # errors if pyproject.toml and uv.lock disagree instead of silently
          # resolving new versions, so CI installs exactly the locked graph and
          # never mutates the lockfile. (This also cured the Poetry hang, whose
          # lockless universal resolve backtracked for minutes on the analyzer's
          # --all-extras graph.) The `dev` dependency group supplies the test
          # tooling (pytest, diff-cover, ...) plus `pip`, which spaCy's model
          # download shells out to via `python -m pip install`. Later steps run
          # inside the synced venv with `uv run --no-sync` (the wheel-build step
          # deliberately uses the system interpreter, as it did under Poetry).
          uv sync --locked ${{ matrix.component.extras }} --group dev --python ${{ matrix.python-version }}

      - name: Install presidio-analyzer for Image Redactor
        if: matrix.component.name == 'Image Redactor'
        working-directory: ${{ matrix.component.path }}
        run: |
          # Override the locked PyPI presidio-analyzer with the in-repo copy so
          # the image-redactor tests run against local analyzer changes. This
          # editable sibling install isn't expressible in a single-package lock;
          # the following steps use `uv run --no-sync` so uv won't revert it.
          uv pip install -e ../presidio-analyzer/.

      - name: Download spaCy models
        if: matrix.component.spacy-models != ''
        working-directory: ${{ matrix.component.path }}
        run: |
          for model in ${{ matrix.component.spacy-models }}; do
            uv run --no-sync python -m spacy download $model
          done

      - name: Run tests with coverage
        working-directory: ${{ matrix.component.path }}
        run: |
          PACKAGE_NAME=$(echo "${{ matrix.component.path }}" | sed 's/-/_/g')
          uv run --no-sync pytest --cov=$PACKAGE_NAME --cov-report=xml:coverage.xml --cov-report=term --cov-report=html -vv --tb=short
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Checking PR difference coverage (>= ${{ env.COVERAGE_THRESHOLD }}%) with diff-cover..."
            uv run --no-sync diff-cover coverage.xml \
              --compare-branch=origin/${{ github.base_ref }} \
              --fail-under=${{ env.COVERAGE_THRESHOLD }} \
              --show-uncovered
          fi

      - name: Comment PR with Coverage
        if: matrix.python-version == env.PRIMARY_PYTHON && github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@63f52f4fbbffada6e8dee8ec432de7e01df9ba79 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 85
          MINIMUM_ORANGE: 70
          COVERAGE_DATA_BRANCH: coverage-data
          SUBPROJECT_ID: ${{ matrix.component.path }}
          COVERAGE_PATH: ${{ matrix.component.path }}

      - name: Build wheel package
        working-directory: ${{ matrix.component.path }}
        run: |
          # `build` needs `tomli` on Python < 3.11 to read pyproject.toml, but
          # it is absent from the hashed requirements file (pip-compiled on
          # 3.11+). Poetry used to install it onto the runner incidentally; uv
          # has no Python dependencies, so pre-install it (marker-guarded) here
          # so `pip install --require-hashes` finds it already satisfied rather
          # than trying to fetch it unhashed.
          python -m pip install "tomli==2.4.1; python_version < '3.11'"
          pip install --require-hashes -r ${{ github.workspace }}/.github/pipelines/requirements-build.txt
          python -m build --wheel

      - name: Minimize uv cache
        if: always()
        run: |
          # Drop pre-built wheels that uv can cheaply rebuild, keeping the
          # persisted /mnt cache small (recommended for CI by the uv docs).
          uv cache prune --ci

  build-platform-images:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [lint]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - image: presidio-anonymizer
            platform: linux/amd64
            platform_tag: linux-amd64
            runner: ubuntu-latest
          - image: presidio-analyzer
            platform: linux/amd64
            platform_tag: linux-amd64
            runner: ubuntu-latest
          - image: presidio-image-redactor
            platform: linux/amd64
            platform_tag: linux-amd64
            runner: ubuntu-latest
          - image: presidio-anonymizer
            platform: linux/arm64
            platform_tag: linux-arm64
            runner: ubuntu-24.04-arm
          - image: presidio-analyzer
            platform: linux/arm64
            platform_tag: linux-arm64
            runner: ubuntu-24.04-arm
          - image: presidio-image-redactor
            platform: linux/arm64
            platform_tag: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build ${{ matrix.image }} image artifact
        run: |
          mkdir -p image-artifacts
          image_ref="${{ env.REGISTRY_NAME }}/${{ matrix.image }}:${{ env.TAG }}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --cache-from type=registry,ref=${{ env.REGISTRY_NAME }}/${{ matrix.image }}:latest \
            --tag "${image_ref}" \
            --output type=docker,dest="image-artifacts/${{ matrix.image }}.tar" \
            ./${{ matrix.image }}
          gzip "image-artifacts/${{ matrix.image }}.tar"

      - name: Upload ${{ matrix.image }} image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.image }}-${{ matrix.platform_tag }}
          path: image-artifacts/${{ matrix.image }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  e2e-tests:
    name: E2E Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: build-platform-images
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            platform_tag: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform_tag: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          persist-credentials: false

      - name: Download image artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: presidio-*-${{ matrix.platform_tag }}
          path: image-artifacts
          merge-multiple: true

      - name: Load Presidio images
        run: |
          for image_archive in image-artifacts/*.tar.gz; do
            gzip -dc "${image_archive}" | docker load
          done
          docker image ls

      - name: Start Presidio cluster
        run: |
          export DOCKER_DEFAULT_PLATFORM=${{ matrix.platform }}
          docker compose -f docker-compose.yml up -d --no-build
        env:
          REGISTRY_NAME: ${{ env.REGISTRY_NAME }}
          IMAGE_PREFIX: ''
          TAG: ':${{ env.TAG }}'

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'

      - name: Cache E2E dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: |
            ~/.cache/pip
            e2e-tests/env
          key: ${{ runner.os }}-${{ matrix.platform }}-e2e-${{ hashFiles('e2e-tests/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-e2e-

      - name: Install E2E test dependencies
        working-directory: e2e-tests
        run: |
          python -m venv env
          source env/bin/activate
          pip install -r requirements.txt
          python -m spacy download en_core_web_lg

      - name: Wait for services to be ready
        run: sleep 60

      - name: Download Ollama model for Ollama LangExtract recognizer tests
        run: |
          docker exec $(docker ps -qf "name=ollama") ollama pull qwen2.5:1.5b
          docker exec $(docker ps -qf "name=ollama") ollama run qwen2.5:1.5b

      - name: Run E2E tests
        working-directory: e2e-tests
        run: |
          source env/bin/activate
          pytest -vv --tb=short

      - name: Capture Docker logs on failure (${{ matrix.platform }})
        if: failure()
        run: |
          echo "Capturing Docker logs for platform: ${{ matrix.platform }}"
          docker compose -f docker-compose.yml logs

      - name: Stop Docker containers
        if: always()
        run: |
          docker compose -f docker-compose.yml down

  # Build and test Docker images locally for non-main branches without publishing.
  local-build-and-test:
    name: Local Build and E2E Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [lint]
    if: github.ref != 'refs/heads/main'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Presidio images locally
        run: |
          # Build all images locally without pushing
          docker compose -f docker-compose.yml build
        env:
          REGISTRY_NAME: ${{ env.REGISTRY_NAME }}
          IMAGE_PREFIX: ''
          TAG: ':${{ env.TAG }}'

      - name: Start Presidio cluster locally
        run: |
          docker compose -f docker-compose.yml up -d
        env:
          REGISTRY_NAME: ${{ env.REGISTRY_NAME }}
          IMAGE_PREFIX: ''
          TAG: ':${{ env.TAG }}'

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'

      - name: Cache E2E dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: |
            ~/.cache/pip
            e2e-tests/env
          key: ${{ runner.os }}-${{ matrix.platform }}-local-e2e-${{ hashFiles('e2e-tests/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-local-e2e-

      - name: Install E2E test dependencies
        working-directory: e2e-tests
        run: |
          python -m venv env
          source env/bin/activate
          pip install -r requirements.txt
          python -m spacy download en_core_web_lg

      - name: Wait for services to be ready
        run: sleep 60

      - name: Download Ollama model for Ollama LangExtract recognizer tests
        run: |
          docker exec $(docker ps -qf "name=ollama") ollama pull qwen2.5:1.5b
          docker exec $(docker ps -qf "name=ollama") ollama run qwen2.5:1.5b

      - name: Run E2E tests
        working-directory: e2e-tests
        run: |
          source env/bin/activate
          pytest -vv --tb=short

      - name: Capture Docker logs on failure
        if: failure()
        run: |
          echo "Capturing Docker logs for local build"
          docker compose -f docker-compose.yml logs

      - name: Stop Docker containers
        if: always()
        run: |
          docker compose -f docker-compose.yml down
