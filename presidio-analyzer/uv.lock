[[package]]
name = "presidio-analyzer"
version = "2.2.365"
source = { editable = "." }
dependencies = [
    { name = "click" },
    { name = "numpy" },
    { name = "phonenumbers" },
    { name = "preshed" },
    { name = "pydantic" },
    { name = "pyyaml" },
    { name = "regex" },
    { name = "spacy" },
    { name = "tldextract" },
]

[package.optional-dependencies]
ahds = [
    { name = "azure-health-deidentification" },
    { name = "azure-identity" },
]
azure-ai-language = [
    { name = "azure-ai-textanalytics" },
    { name = "azure-core" },
]
gliner = [
    { name = "gliner" },
    { name = "huggingface-hub" },
    { name = "onnxruntime" },
    { name = "transformers" },
]
langextract = [
    { name = "azure-identity" },
    { name = "jinja2" },
    { name = "langextract" },
    { name = "more-itertools" },
    { name = "openai" },
]
server = [
    { name = "flask" },
    { name = "gunicorn", marker = "sys_platform != 'win32'" },
    { name = "waitress", marker = "sys_platform == 'win32'" },
]
stanza = [
    { name = "stanza" },
]
transformers = [
    { name = "accelerate" },
    { name = "huggingface-hub" },
    { name = "transformers" },
]

[package.dev-dependencies]
dev = [
    { name = "diff-cover" },
    { name = "pip" },
    { name = "pre-commit" },
    { name = "pytest" },
    { name = "pytest-cov" },
    { name = "pytest-mock" },
    { name = "python-dotenv" },
    { name = "ruff" },
]

