[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[project]
name = "presidio_analyzer"
version = "2.2.365"
description = "Presidio Analyzer package"
authors = [{name = "Presidio", email = "presidio@dataprivacystack.org"}]
license = "MIT"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["presidio_analyzer"]
urls = {Homepage = "https://github.com/data-privacy-stack/presidio"}
readme = "README.md"
include = ["conf/*",]

requires-python = ">=3.11,<3.15"
dependencies = [
    "spacy (>=3.4.4,!=3.7.0,<4.0.0); python_version < '3.14'",
    "spacy (>=3.4.4,!=3.7.0,!=3.8.14,<4.0.0); python_version >= '3.14'",
    # preshed 3.0.14 breaks spaCy model loading (OverflowError in Tokenizer._flush_specials,
    # explosion/spaCy#14058); remove once fixed upstream.
    "preshed (<3.0.14)",
    "numpy (>=1.19.0,<2.5.0)",
    "click (>=8.1.0,<9.0.0)",
    "regex (>=2023.0.0)",
    "tldextract (>=5.3.1,<6.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "phonenumbers (>=9.0.28,<10.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
]

[project.entry-points."spacy_factories"]
presidio_hf_token_pipe = "presidio_analyzer.nlp_engine.huggingface_token_pipe:create_huggingface_token_pipe"

[project.optional-dependencies]
server = [
    "flask (>=1.1,<4.0.0)",
    "gunicorn (>=20.0.0,<26.0.0); platform_system != 'Windows'",
    "waitress (>=2.0.0,<4.0.0); platform_system == 'Windows'"
]
transformers = [
    "transformers (>=4.28.0,<6.0.0)",
    "accelerate (>=0.20.0,<2.0.0)",
    "huggingface_hub (>=0.20.0,<2.0.0)"]

stanza = [
    "stanza (>=1.11.1,<2.0.0)",
]
azure-ai-language = [
    "azure-ai-textanalytics (>=5.4.0,<6.0.0)",
    "azure-core (>=1.39.0,<2.0.0)",
]
ahds = [
    "azure-identity (>=1.25.3,<2.0.0)",
    "azure-health-deidentification (>=1.1.0b1,<2.0.0)"
]
gliner = [
    "transformers (>=4.51.3,<5.17.0)",
    "huggingface_hub",
    "gliner (>=0.2.29,<1.0.0)",
    "onnxruntime (>=1.19)"
]
langextract = [
    "langextract (>=1.0.0,<2.0.0)",
    "openai (>=1.50.0,<3.0.0)",
    "azure-identity (>=1.18.0,<2.0.0)",
    "more-itertools (>=10.0.0,<12.0.0)",
    "jinja2 (>=3.0.0,<4.0.0)",
]

[dependency-groups]
dev = [
    "pip",
    "ruff",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "python-dotenv",
    "pre-commit",
    "diff-cover",
]

[tool.coverage.run]
relative_files = true
source = ["."]
